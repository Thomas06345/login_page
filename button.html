<!DOCTYPE html>
<html>
    <head>
        <title>Button</title>
        <style>
            .hide{
                display: none;
            }
        </style>
    </head>
    <body>
        <p id="p1">hello press this button to make this paragragh disappiar</p>
        <button onclick="hide()">Hide</button>
        <script>
            function hide(){
                document.getElementById('p1').classList.toggle("hide");
            }
        </script>
    </body>
</html>
